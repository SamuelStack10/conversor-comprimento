<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Comprimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Conversor de Comprimento</h1>
            <label for="valor">Valor</label>
            <input type="number" id="valor" placeholder="Digite um numero" value="1">
            <div class="selects">
                <div>
                    <label for="unidadeOrigem">De</label>
                    <select id="unidadeOrigem">
                        <option value="m">Metro (m)</option>
                        <option value="cm">Centimetro (cm)</option>
                        <option value="km">Quilometro (km)</option>
                        <option value="in">Polegada (in)</option>
                        <option value="ft">Pe (ft)</option>
                    </select>
                    </div>
                    <span class="seta">&#8594;</span>
                    <div>
                    <label for="unidadeDestino">Para</label>
                        <select id="unidadeDestino">
                        <option value="m">Metro (m)</option>
                        <option value="cm">Centimetro (cm)</option>
                        <option value="km">Quilometro (km)</option>
                        <option value="in">Polegada (in)</option>
                        <option value="ft">Pe (ft)</option>
                    </select>
                </div>
            </div>

        <button id="btnConverter"> Converter </button>

        <p id="resultado" class="resultado"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
